# Build du mod et exécution des vérifications à chaque push / pull request.
# - `./gradlew build` : compile + JUnit + Game Tests serveur (runGameTest)
# - `./gradlew runClientGameTest` : tests client avec screenshots (nécessite Xvfb)

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and run server-side tests
        run: ./gradlew build --no-daemon --stacktrace

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Run client game tests
        run: xvfb-run ./gradlew runClientGameTest --no-daemon --stacktrace

      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
